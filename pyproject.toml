[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsquire"
version = "0.1.0"
description = "LLM Squire — Koans for mastering LLM invocation, harness creation, skills, and evaluation-driven development"
readme = "README.md"
license = {text = "Proprietary — © 2026 Improving. All rights reserved."}
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
llmsquire = "llmsquire.__main__:main"

[tool.setuptools]
packages = ["llmsquire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]